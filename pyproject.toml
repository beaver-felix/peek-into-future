[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "peek-future"
version = "0.1.0"
description = "Reimplementation of Peeking Into The Future For Contextual Biasing (arXiv:2512.17657)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Duma"}]
dependencies = [
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "polars>=0.20.0",
    "orjson>=3.9.0",
    "datasets>=2.14.0",
    "huggingface_hub>=0.19.0",
    "spacy>=3.7.2",
    "underthesea>=6.8.0",
    "jiwer>=3.0.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
    "sentencepiece>=0.1.99",
    "soundfile>=0.12.1",
    "librosa>=0.10.0",
    "matplotlib>=3.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["peek_future*"]
