defaults:
  - base

environment:
  name: "kaggle"
  accelerator: "2x_t4"
  num_gpus: 2
  device: "cuda"

training:
  batch_size: 16               # Per-GPU batch size (effective 32 across 2x T4)
  accumulate_grad_batches: 2   # Effective global batch size = 16 * 2 * 2 = 64
  num_workers: 2               # 2 workers per GPU = 4 total workers matching Kaggle 4 vCPUs
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  amp: true
  amp_dtype: "float16"         # Turing Tensor Cores FP16
  ddp: true

